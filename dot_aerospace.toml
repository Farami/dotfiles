# Migrated from ~/.config/yabai/yabairc and ~/.config/skhd/skhdrc
# See: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# yabai: borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0
after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

start-at-login = true

# yabai layout bsp — disable normalizations so split/insert bindings behave closer to yabai
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# yabai: layout bsp, split_ratio 0.50, auto_balance off
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# yabai: mouse_follows_focus off, focus_follows_mouse off
on-focused-monitor-changed = []

# yabai: sketchybar window_created/window_destroyed → window_change
on-focus-changed = [
    'exec-and-forget /bin/bash -c "sketchybar -m --trigger window_change &> /dev/null"',
]

automatically-unhide-macos-hidden-apps = false

# Workspaces 1–8 used in skhd
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

[key-mapping]
    preset = 'qwerty'

# yabai: top/bottom/left/right_padding 8, window_gap 10
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

# yabai: manage=off rules
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

