# skhd active bindings (commented-out bindings from skhdrc are noted inline)
[mode.main.binding]

    # workspace switching
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'

    # focus window
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-left = 'focus left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus right'

    # skhd: shift + alt - arrow → swap window
    alt-shift-left = 'swap left'
    alt-shift-down = 'swap down'
    alt-shift-up = 'swap up'
    alt-shift-right = 'swap right'

    # skhd: shift + cmd - arrow → warp window
    cmd-shift-left = 'move left'
    cmd-shift-down = 'move down'
    cmd-shift-up = 'move up'
    cmd-shift-right = 'move right'

    # skhd: shift + cmd - e → balance
    cmd-shift-e = 'balance-sizes'

    # skhd: shift + cmd - x → window --space recent; space --focus recent
    # AeroSpace has no per-window "recent space"; workspace-back-and-forth is closest
    cmd-shift-x = 'workspace-back-and-forth'

    # skhd: shift + cmd - z → window --space prev; space --focus prev
    cmd-shift-z = 'move-node-to-workspace prev --focus-follows-window'

    # skhd: shift + cmd - 1..8 → send window to desktop and follow focus
    cmd-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    cmd-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    cmd-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    cmd-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    cmd-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    cmd-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    cmd-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    cmd-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'

    # skhd: ctrl + cmd - x → window --display recent; display --focus recent
    # No AeroSpace equivalent for "recent monitor"

    # skhd: ctrl + cmd - z/c → send window to prev/next monitor and follow focus
    cmd-ctrl-z = 'move-node-to-monitor prev --focus-follows-window'
    cmd-ctrl-c = 'move-node-to-monitor next --focus-follows-window'

    # skhd: ctrl + cmd - 1..3 → send window to monitor and follow focus
    cmd-ctrl-1 = 'move-node-to-monitor 1 --focus-follows-window'
    cmd-ctrl-2 = 'move-node-to-monitor 2 --focus-follows-window'
    cmd-ctrl-3 = 'move-node-to-monitor 3 --focus-follows-window'

    # skhd: shift + ctrl - a/s/w/d → move floating window by pixels
    # No AeroSpace equivalent for pixel-relative floating moves
    # ctrl-shift-a = ...
    # ctrl-shift-s = ...
    # ctrl-shift-w = ...
    # ctrl-shift-d = ...

    # skhd: lctrl + alt - h/j/k/l → resize window
    ctrl-alt-h = 'resize width -50'
    ctrl-alt-j = 'resize height +50'
    ctrl-alt-k = 'resize height -50'
    ctrl-alt-l = 'resize width +50'

    # skhd: ctrl + alt - a/s/w/d → set insertion point
    ctrl-alt-a = 'split horizontal'
    ctrl-alt-s = 'split vertical'
    ctrl-alt-w = 'split vertical'
    ctrl-alt-d = 'split horizontal'

    # skhd: alt - r → space --rotate 90
    alt-r = 'layout horizontal vertical'

    # skhd: alt - y/x → mirror tree (no AeroSpace equivalent)
    # alt-y = ...
    # alt-x = ...

    # skhd: alt - d → toggle zoom-parent (no AeroSpace equivalent)
    # alt-d = ...

    # skhd: alt - f → toggle zoom-fullscreen
    alt-f = 'fullscreen'

    # skhd: shift + alt - b → toggle border (handled by external borders tool)
    # alt-shift-b = ...

    # skhd: alt - e → toggle split
    alt-e = 'layout horizontal vertical'

    # skhd: shift + alt - t / alt - t → toggle float + grid center
    # Grid sizing after float is not supported; toggle float/tiling only
    alt-shift-t = 'layout floating tiling'
    alt-t = 'layout floating tiling'

    # skhd: alt - p → picture-in-picture grid size
    alt-p = 'layout floating'

    # skhd: ctrl + alt - z/x → layout bsp / layout float
    ctrl-alt-z = 'layout tiling'
    ctrl-alt-x = 'layout floating'

    # toggle tiles ↔ accordion on focused window's container (usually the whole workspace)
    cmd-comma = 'layout tiles accordion'
